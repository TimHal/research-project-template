# Kaggle Dataset Classification
# ===============================
# Example: downloading and training on a Kaggle dataset.
#
# Requires: pip install kaggle
# Auth: Place your API token at ~/.kaggle/kaggle.json
# Docs: https://github.com/Kaggle/kaggle-api#api-credentials
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/example_kaggle.yaml

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 20
  precision: 16-mixed
  log_every_n_steps: 10
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      tracking_uri: "http://localhost:8090"
      experiment_name: "Kaggle-Classification"
      log_model: true

model:
  class_path: task.ClassificationTask
  init_args:
    num_classes: 131        # Fruits-360 has 131 classes
    learning_rate: 1e-3
    weight_decay: 0.01
    model:
      class_path: model.TIMMModel
      init_args:
        model_name: "resnet18"
        pretrained: true
        num_classes: 131
        in_chans: 3
    scheduler_class: torch.optim.lr_scheduler.CosineAnnealingLR
    scheduler_params:
      T_max: 20

# --- ImageFolder mode (most Kaggle image datasets) ---
data:
  class_path: data.KaggleDataModule
  init_args:
    dataset_slug: "moltean/fruits"
    root_dir: "./data/kaggle_fruits"
    load_format: "imagefolder"
    img_size: [224, 224]
    img_mode: "RGB"
    batch_size: 32
    num_workers: 4
    norm_mean: [0.485, 0.456, 0.406]
    norm_std: [0.229, 0.224, 0.225]
    train_val_split: [0.9, 0.1]
    augmentation: "basic"

# --- CSV mode with pixel data (uncomment for Kaggle competitions like digit-recognizer) ---
# data:
