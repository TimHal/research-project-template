# ImageFolder Classification
# ===========================
# Example: loading images organized as class subdirectories.
#
# Expected layout:
#   ./data/my_dataset/
#   ├── train/
#   │   ├── cats/
#   │   │   ├── img001.jpg
#   │   │   └── ...
#   │   └── dogs/
#   │       └── ...
#   └── test/
#       └── ...
#
# Or a single directory (auto-split into train/val):
#   ./data/my_dataset/
#   ├── cats/
#   └── dogs/
#
# Usage:
#   conda activate mlresearch
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/example_imagefolder.yaml
#
# Quick test:
#   PYTHONPATH=src python src/cli.py fit --config conf/experiment/example_imagefolder.yaml --trainer.fast_dev_run=true

seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  max_epochs: 30
  precision: 16-mixed
  log_every_n_steps: 10
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      tracking_uri: "http://localhost:8090"
      experiment_name: "ImageFolder-Classification"
      log_model: true

model:
  class_path: task.ClassificationTask.ClassificationTask
  init_args:
    num_classes: 2          # adjust to your dataset
    learning_rate: 1e-3
    weight_decay: 0.01
    model:
      class_path: model.TIMMModel.TIMMModel
      init_args:
        model_name: "resnet18"
        pretrained: true
        num_classes: 2      # adjust to your dataset
        in_chans: 3
    scheduler_class: torch.optim.lr_scheduler.CosineAnnealingLR
    scheduler_params:
      T_max: 30

data:
  class_path: data.ImageFolderDatamodule.ImageFolderDatamodule
  init_args:
    root_dir: "./data/my_dataset"
    img_size: [224, 224]
    img_mode: "RGB"
    batch_size: 32
    num_workers: 4
    norm_mean: [0.485, 0.456, 0.406]
    norm_std: [0.229, 0.224, 0.225]
    train_val_split: [0.9, 0.1]
    augmentation: "basic"

early_stopping: true
early_stopping_patience: 5
