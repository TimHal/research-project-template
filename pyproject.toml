[project]
name = "research-project-template"
version = "0.1.0"
description = "Minimal PyTorch Lightning template for ML research"
requires-python = ">=3.10"

# Note: Dependencies are managed via conda environment (mlresearch)
# This file is for project metadata only

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "D"]
# D107: constructor args are documented on the class docstring, not on __init__.
ignore = ["E501", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names describe the case; a docstring on every test function is noise.
"tests/*" = ["D103"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "data", "model", "task", "util"]

[tool.pytest.ini_options]
# Put src/ on the import path so tests can `import task`, `import data`, ...
# without the PYTHONPATH=src prefix.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
